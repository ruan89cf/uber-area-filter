<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Gerenciar Zonas no Mapa</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: sans-serif;
            overflow: hidden;
            background: #121212;
        }
        #map {
            width: 100%;
            height: 100%;
        }
        .top-panel {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            z-index: 1000;
            background: rgba(20, 20, 20, 0.92);
            color: #fff;
            padding: 10px 12px;
            border-radius: 12px;
            font-size: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.45);
            display: flex;
            flex-direction: column;
            gap: 7px;
        }
        .mode-row {
            display: flex;
            gap: 6px;
        }
        .mode-btn {
            flex: 1;
            border: 2px solid #444;
            border-radius: 8px;
            padding: 8px 6px;
            font-size: 12px;
            font-weight: bold;
            background: #2b2b2b;
            color: #ccc;
            cursor: pointer;
        }
        .mode-btn.active-allowed {
            background: #1b5e20;
            border-color: #69f0ae;
            color: #fff;
        }
        .mode-btn.active-blocked {
            background: #b71c1c;
            border-color: #ff8a80;
            color: #fff;
        }
        .mode-btn.active-shape {
            background: #0d47a1;
            border-color: #82b1ff;
            color: #fff;
        }
        #statusBanner {
            font-size: 12px;
            color: #e0e0e0;
            line-height: 1.3;
        }
        #circleSliderRow {
            display: none;
            align-items: center;
            gap: 8px;
            background: #1e293b;
            padding: 6px 10px;
            border-radius: 8px;
        }
        #circleSliderRow input[type=range] {
            flex: 1;
        }
        .radius-btn {
            background: #334155;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 5px 9px;
            font-weight: bold;
            font-size: 13px;
        }
        .bottom-controls {
            position: absolute;
            bottom: 14px;
            left: 10px;
            right: 10px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 7px;
        }
        .row {
            display: flex;
            gap: 7px;
        }
        .ctrl-btn {
            flex: 1;
            border: none;
            border-radius: 10px;
            padding: 11px 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.35);
        }
        .btn-secondary {
            background: #ffffff;
            color: #222;
        }
        .btn-add-zone {
            background: #1565c0;
            color: #fff;
        }
        .btn-danger {
            background: #ffebee;
            color: #c62828;
        }
        .btn-primary {
            background: #1b5e20;
            color: #ffffff;
            font-size: 15px;
            padding: 14px;
            border: 1px solid #69f0ae;
        }
        .vertex-icon {
            background: #1b5e20;
            color: #fff;
            border: 2px solid #fff;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            text-align: center;
            line-height: 20px;
            font-size: 12px;
            font-weight: bold;
            box-shadow: 0 1px 4px rgba(0,0,0,0.5);
        }
        .vertex-icon-blocked {
            background: #b71c1c;
            color: #fff;
            border: 2px solid #fff;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            text-align: center;
            line-height: 20px;
            font-size: 12px;
            font-weight: bold;
            box-shadow: 0 1px 4px rgba(0,0,0,0.5);
        }
        .zone-label {
            background: rgba(0,0,0,0.75);
            color: #fff;
            padding: 2px 6px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div class="top-panel">
        <div class="mode-row">
            <button id="btnModeAllowed" class="mode-btn active-allowed" onclick="setZoneMode('ALLOWED')">🟢 Área Permitida</button>
            <button id="btnModeBlocked" class="mode-btn" onclick="setZoneMode('BLOCKED')">🔴 Área Proibida (Não Ir)</button>
        </div>
        <div class="mode-row">
            <button id="btnShapePoly" class="mode-btn active-shape" onclick="setZoneShape('POLYGON')">📐 Polígono (Pontos)</button>
            <button id="btnShapeCircle" class="mode-btn" onclick="setZoneShape('CIRCLE')">⭕ Círculo (Expansível)</button>
        </div>
        <div id="circleSliderRow">
            <button class="radius-btn" onclick="stepRadius(-200)">-200m</button>
            <input type="range" id="radiusSlider" min="200" max="10000" step="100" value="1200" oninput="onRadiusChange(this.value)" />
            <button class="radius-btn" onclick="stepRadius(200)">+200m</button>
            <span id="radiusValueTxt" style="min-width:58px;text-align:right;font-weight:bold;color:#82b1ff;">1,2 km</span>
        </div>
        <div id="statusBanner">
            Toque no mapa para desenhar. Você pode criar vários Polígonos e Círculos (Permitidos 🟢 ou Proibidos 🔴).
        </div>
    </div>

    <div id="map"></div>

    <div class="bottom-controls">
        <div class="row">
            <button class="ctrl-btn btn-secondary" onclick="undoCurrent()">↩ Desfazer</button>
            <button class="ctrl-btn btn-add-zone" onclick="commitCurrentAndStartNew()">➕ + Outra Área</button>
            <button class="ctrl-btn btn-danger" onclick="deleteSelectedOrClear()">🗑 Excluir</button>
        </div>
        <button class="ctrl-btn btn-primary" id="btnConfirmAll" onclick="confirmAllZones()">✅ Salvar Todas as Áreas e Extrair Ruas</button>
    </div>

    <script>
        var defaultLat = -22.8425;
        var defaultLng = -43.2785;

        var map = L.map('map', { zoomControl: false }).setView([defaultLat, defaultLng], 13);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // Lista de zonas salvas: { id, name, mode: 'ALLOWED'|'BLOCKED', shape: 'POLYGON'|'CIRCLE', points: [[lat,lng]], centerLat, centerLng, radiusMeters }
        var savedZones = [];
        var selectedSavedIndex = -1;

        // Zona sendo desenhada atualmente
        var currentMode = 'ALLOWED';
        var currentShape = 'POLYGON';
        var currentPoints = [];
        var currentCenter = null;
        var currentRadius = 1200;

        var savedGroup = L.layerGroup().addTo(map);
        var activeGroup = L.layerGroup().addTo(map);

        function formatRadius(m) {
            if (m >= 1000) {
                return (m / 1000).toFixed(1).replace('.', ',') + ' km';
            }
            return Math.round(m) + ' m';
        }

        function setZoneMode(mode) {
            currentMode = mode;
            document.getElementById('btnModeAllowed').className = 'mode-btn' + (mode === 'ALLOWED' ? ' active-allowed' : '');
            document.getElementById('btnModeBlocked').className = 'mode-btn' + (mode === 'BLOCKED' ? ' active-blocked' : '');
            redrawAll();
        }

        function setZoneShape(shape) {
            // Se tinha algo valido sendo desenhado na outra forma, guarda automaticamente!
            if (currentShape !== shape) {
                autoCommitCurrentIfValid();
            }
            currentShape = shape;
            document.getElementById('btnShapePoly').className = 'mode-btn' + (shape === 'POLYGON' ? ' active-shape' : '');
            document.getElementById('btnShapeCircle').className = 'mode-btn' + (shape === 'CIRCLE' ? ' active-shape' : '');
            document.getElementById('circleSliderRow').style.display = (shape === 'CIRCLE') ? 'flex' : 'none';
            redrawAll();
        }

        function onRadiusChange(val) {
            currentRadius = Number(val);
            document.getElementById('radiusValueTxt').innerText = formatRadius(currentRadius);
            if (selectedSavedIndex >= 0 && savedZones[selectedSavedIndex] && savedZones[selectedSavedIndex].shape === 'CIRCLE') {
                savedZones[selectedSavedIndex].radiusMeters = currentRadius;
            }
            redrawAll();
        }

        function stepRadius(delta) {
            var next = Math.max(150, Math.min(15000, currentRadius + delta));
            var slider = document.getElementById('radiusSlider');
            slider.value = next;
            onRadiusChange(next);
        }

        function autoCommitCurrentIfValid() {
            if (currentShape === 'POLYGON' && currentPoints.length >= 3) {
                var num = savedZones.length + 1;
                savedZones.push({
                    id: Date.now() + num,
                    name: (currentMode === 'ALLOWED' ? 'Permitida ' : 'Proibida ') + num,
                    mode: currentMode,
                    shape: 'POLYGON',
                    points: currentPoints.slice(),
                    centerLat: 0,
                    centerLng: 0,
                    radiusMeters: 0
                });
                currentPoints = [];
                return true;
            } else if (currentShape === 'CIRCLE' && currentCenter) {
                var numC = savedZones.length + 1;
                savedZones.push({
                    id: Date.now() + numC,
                    name: (currentMode === 'ALLOWED' ? 'Círculo ' : 'Proibido ') + numC,
                    mode: currentMode,
                    shape: 'CIRCLE',
                    points: [],
                    centerLat: currentCenter[0],
                    centerLng: currentCenter[1],
                    radiusMeters: currentRadius
                });
                currentCenter = null;
                return true;
            }
            return false;
        }

        function commitCurrentAndStartNew() {
            var added = autoCommitCurrentIfValid();
            selectedSavedIndex = -1;
            redrawAll();
            if (!added) {
                var el = document.getElementById('statusBanner');
                el.innerText = 'Toque no mapa para iniciar a nova área (' + (currentShape === 'CIRCLE' ? 'Círculo' : 'Polígono') + ').';
            }
        }

        function redrawAll() {
            savedGroup.clearLayers();
            activeGroup.clearLayers();

            // 1. Desenha zonas ja salvas na lista
            savedZones.forEach(function(z, idx) {
                var isAllowed = z.mode === 'ALLOWED';
                var isSelected = (idx === selectedSavedIndex);
                var strokeColor = isSelected ? '#ffeb3b' : (isAllowed ? '#00e676' : '#ff1744');
                var fillColor = isAllowed ? '#4caf50' : '#f44336';
                var weight = isSelected ? 4 : 3;

                if (z.shape === 'CIRCLE' && z.centerLat && z.centerLng) {
                    var circle = L.circle([z.centerLat, z.centerLng], {
                        radius: z.radiusMeters || 1000,
                        color: strokeColor,
                        weight: weight,
                        fillColor: fillColor,
                        fillOpacity: isSelected ? 0.45 : 0.28
                    }).addTo(savedGroup);

                    circle.on('click', function(ev) {
                        L.DomEvent.stopPropagation(ev);
                        selectedSavedIndex = idx;
                        if (z.shape === 'CIRCLE') {
                            currentRadius = z.radiusMeters || 1000;
                            document.getElementById('radiusSlider').value = currentRadius;
                            document.getElementById('radiusValueTxt').innerText = formatRadius(currentRadius);
                            document.getElementById('circleSliderRow').style.display = 'flex';
                        }
                        redrawAll();
                    });
                } else if (z.points && z.points.length >= 3) {
                    var poly = L.polygon(z.points, {
                        color: strokeColor,
                        weight: weight,
                        fillColor: fillColor,
                        fillOpacity: isSelected ? 0.45 : 0.28
                    }).addTo(savedGroup);

                    poly.on('click', function(ev) {
                        L.DomEvent.stopPropagation(ev);
                        selectedSavedIndex = idx;
                        redrawAll();
                    });
                }
            });

            // 2. Desenha zona em edicao atual
            var isCurAllowed = (currentMode === 'ALLOWED');
            var curStroke = isCurAllowed ? '#1b5e20' : '#b71c1c';
            var curFill = isCurAllowed ? '#4caf50' : '#ef5350';
            var iconClass = isCurAllowed ? 'vertex-icon' : 'vertex-icon-blocked';

            if (currentShape === 'POLYGON') {
                currentPoints.forEach(function(pt, idx) {
                    var icon = L.divIcon({
                        className: iconClass,
                        html: '' + (idx + 1),
                        iconSize: [24, 24],
                        iconAnchor: [12, 12]
                    });
                    var marker = L.marker(pt, { draggable: true, icon: icon }).addTo(activeGroup);
                    marker.on('drag', function(e) {
                        var pos = e.target.getLatLng();
                        currentPoints[idx] = [pos.lat, pos.lng];
                        redrawAll();
                    });
                });

                if (currentPoints.length >= 2) {
                    L.polygon(currentPoints, {
                        color: curStroke,
                        weight: 3,
                        fillColor: curFill,
                        fillOpacity: 0.35
                    }).addTo(activeGroup);
                }
            } else if (currentShape === 'CIRCLE' && currentCenter) {
                L.circle(currentCenter, {
                    radius: currentRadius,
                    color: curStroke,
                    weight: 3,
                    fillColor: curFill,
                    fillOpacity: 0.35
                }).addTo(activeGroup);

                var cIcon = L.divIcon({
                    className: iconClass,
                    html: '⭕',
                    iconSize: [26, 26],
                    iconAnchor: [13, 13]
                });
                var cMarker = L.marker(currentCenter, { draggable: true, icon: cIcon }).addTo(activeGroup);
                cMarker.on('drag', function(e) {
                    var pos = e.target.getLatLng();
                    currentCenter = [pos.lat, pos.lng];
                    redrawAll();
                });
            }

            updateStatusText();
        }

        function updateStatusText() {
            var el = document.getElementById('statusBanner');
            var allowedCount = savedZones.filter(function(z) { return z.mode === 'ALLOWED'; }).length;
            var blockedCount = savedZones.filter(function(z) { return z.mode === 'BLOCKED'; }).length;
            var summary = 'Salvas: ' + allowedCount + ' Permitida(s) 🟢 | ' + blockedCount + ' Proibida(s) 🔴. ';

            if (selectedSavedIndex >= 0 && savedZones[selectedSavedIndex]) {
                var sel = savedZones[selectedSavedIndex];
                el.innerText = summary + 'Selecionada: ' + sel.name + ' (toque em 🗑 Excluir para remover ou ajuste o raio).';
                return;
            }

            if (currentShape === 'CIRCLE') {
                if (!currentCenter) {
                    el.innerText = summary + 'Toque no mapa para posicionar o Círculo (' + formatRadius(currentRadius) + ').';
                } else {
                    el.innerText = summary + 'Círculo de ' + formatRadius(currentRadius) + ' pronto! Arraste a barra para expandir ou toque em + Outra Área.';
                }
            } else {
                if (currentPoints.length === 0) {
                    el.innerText = summary + 'Toque no mapa para marcar os pontos do Polígono.';
                } else if (currentPoints.length < 3) {
                    el.innerText = summary + currentPoints.length + ' ponto(s). Marque pelo menos 3 pontos.';
                } else {
                    el.innerText = summary + 'Polígono com ' + currentPoints.length + ' pontos pronto! Toque em + Outra Área ou Salvar.';
                }
            }
        }

        map.on('click', function(e) {
            selectedSavedIndex = -1;
            if (currentShape === 'CIRCLE') {
                currentCenter = [e.latlng.lat, e.latlng.lng];
            } else {
                currentPoints.push([e.latlng.lat, e.latlng.lng]);
            }
            redrawAll();
        });

        function undoCurrent() {
            if (currentShape === 'POLYGON' && currentPoints.length > 0) {
                currentPoints.pop();
                redrawAll();
            } else if (currentShape === 'CIRCLE' && currentCenter) {
                currentCenter = null;
                redrawAll();
            } else if (savedZones.length > 0) {
                savedZones.pop();
                selectedSavedIndex = -1;
                redrawAll();
            }
        }

        function deleteSelectedOrClear() {
            if (selectedSavedIndex >= 0 && selectedSavedIndex < savedZones.length) {
                savedZones.splice(selectedSavedIndex, 1);
                selectedSavedIndex = -1;
                redrawAll();
                return;
            }
            if (currentPoints.length > 0 || currentCenter) {
                currentPoints = [];
                currentCenter = null;
                redrawAll();
                return;
            }
            if (savedZones.length > 0) {
                savedZones = [];
                selectedSavedIndex = -1;
                redrawAll();
            }
        }

        function loadExistingZones(jsonStr) {
            try {
                var arr = JSON.parse(jsonStr);
                if (Array.isArray(arr) && arr.length > 0) {
                    savedZones = arr;
                    redrawAll();
                    var allLatLngs = [];
                    savedZones.forEach(function(z) {
                        if (z.shape === 'CIRCLE' && z.centerLat && z.centerLng) {
                            allLatLngs.push([z.centerLat, z.centerLng]);
                        } else if (z.points) {
                            z.points.forEach(function(p) { allLatLngs.push(p); });
                        }
                    });
                    if (allLatLngs.length > 0) {
                        map.fitBounds(allLatLngs, { padding: [50, 50], maxZoom: 15 });
                    }
                }
            } catch (e) {}
        }

        // Compatibilidade caso seja chamado pelo nome antigo
        function loadExistingPolygon(jsonStr) {
            try {
                var pts = JSON.parse(jsonStr);
                if (Array.isArray(pts) && pts.length >= 3 && savedZones.length === 0) {
                    savedZones.push({
                        id: 1,
                        name: 'Área Permitida 1',
                        mode: 'ALLOWED',
                        shape: 'POLYGON',
                        points: pts,
                        centerLat: 0,
                        centerLng: 0,
                        radiusMeters: 0
                    });
                    redrawAll();
                    map.fitBounds(pts, { padding: [50, 50] });
                }
            } catch (e) {}
        }

        function confirmAllZones() {
            autoCommitCurrentIfValid();

            if (savedZones.length === 0) {
                if (window.AndroidBridge) {
                    window.AndroidBridge.onError('Adicione pelo menos 1 Polígono (mín. 3 pontos) ou 1 Círculo no mapa!');
                }
                return;
            }

            var btn = document.getElementById('btnConfirmAll');
            if (btn) {
                btn.innerText = '⏳ Salvando zonas e extraindo ruas...';
                btn.disabled = true;
            }
            if (window.AndroidBridge && window.AndroidBridge.onZonesSelected) {
                window.AndroidBridge.onZonesSelected(JSON.stringify(savedZones));
            }
        }
    </script>
</body>
</html>
