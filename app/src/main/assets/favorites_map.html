<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Passageiros e Horarios Favoritos</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: sans-serif;
            background: #121212;
            color: #f5f5f5;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #map {
            width: 100%;
            height: 45%;
            border-bottom: 2px solid #e91e63;
        }
        #listContainer {
            width: 100%;
            height: 55%;
            overflow-y: auto;
            padding: 12px;
            box-sizing: border-box;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .header-title {
            font-size: 16px;
            font-weight: bold;
            color: #ff80ab;
        }
        .header-sub {
            font-size: 11px;
            color: #aaa;
        }
        .fav-card {
            background: #1e1e1e;
            border: 1px solid #333;
            border-left: 4px solid #e91e63;
            border-radius: 12px;
            padding: 11px 12px;
            margin-bottom: 11px;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .fav-card.selected {
            border-color: #ff80ab;
            background: #281b22;
        }
        .fav-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .fav-time {
            font-size: 17px;
            font-weight: bold;
            color: #ff80ab;
        }
        .fav-date {
            font-size: 12px;
            color: #ffd54f;
            font-weight: bold;
        }
        .fav-meta {
            font-size: 12px;
            color: #ccc;
            margin-bottom: 6px;
        }
        .fav-route {
            font-size: 13px;
            line-height: 1.45;
            color: #e0e0e0;
            margin-bottom: 9px;
            background: #161616;
            padding: 7px 9px;
            border-radius: 8px;
        }
        .fav-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .btn {
            border: none;
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-nav-pickup {
            background: #1b5e20;
            color: #fff;
            flex: 1;
        }
        .btn-nav-drop {
            background: #0d47a1;
            color: #fff;
            flex: 1;
        }
        .btn-del {
            background: #421c1c;
            color: #ff8a80;
        }
        .pin-pickup {
            background: #1b5e20;
            color: #fff;
            border: 2px solid #69f0ae;
            border-radius: 14px;
            padding: 2px 7px;
            font-size: 11px;
            font-weight: bold;
            white-space: nowrap;
            box-shadow: 0 2px 6px rgba(0,0,0,0.6);
        }
        .pin-dropoff {
            background: #b71c1c;
            color: #fff;
            border: 2px solid #ff8a80;
            border-radius: 14px;
            padding: 2px 7px;
            font-size: 11px;
            font-weight: bold;
            white-space: nowrap;
            box-shadow: 0 2px 6px rgba(0,0,0,0.6);
        }
        .empty-msg {
            text-align: center;
            color: #999;
            margin-top: 26px;
            font-size: 13px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="listContainer">
        <div class="header-bar">
            <div>
                <div class="header-title">❤️ Passageiros e Horários Favoritos</div>
                <div class="header-sub">Toque em um favorito para ver de onde para onde foi no mapa + alertas 30/20/10 min antes</div>
            </div>
        </div>
        <div id="cardsRoot"></div>
    </div>

    <script>
        var map = L.map('map').setView([-22.8425, -43.2785], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        var layerGroup = L.layerGroup().addTo(map);
        var favItems = [];
        var selectedIdx = -1;

        function renderFavorites(jsonStr) {
            try {
                favItems = JSON.parse(jsonStr) || [];
            } catch (e) {
                favItems = [];
            }

            var root = document.getElementById('cardsRoot');
            root.innerHTML = '';

            if (favItems.length === 0) {
                layerGroup.clearLayers();
                root.innerHTML = '<div class="empty-msg">Nenhum favorito salvo ainda.<br/>Na tela de <b>5 estrelinhas</b> ao final da corrida (ou segurando o botão <b>🟢 ON</b> por 1s), toque em <b>❤️ Favoritar</b>!<br/>O app avisará você 30, 20 e 10 min antes do horário.</div>';
                return;
            }

            favItems.forEach(function(item, idx) {
                var nameLabel = item.passengerName ? ('👤 ' + item.passengerName) : '❤️ Passageiro Favorito';
                var card = document.createElement('div');
                card.className = 'fav-card' + (idx === selectedIdx ? ' selected' : '');
                card.onclick = function() {
                    showRouteOnMap(idx);
                };

                card.innerHTML =
                    '<div class="fav-top">' +
                        '<div class="fav-time">⏰ ' + item.rideTime + ' — ' + nameLabel + '</div>' +
                        '<div class="fav-date">📅 ' + (item.date || 'Salvo') + '</div>' +
                    '</div>' +
                    '<div class="fav-meta">' +
                        (item.rating ? (item.rating + ' • ') : '') +
                        (item.price ? (item.price + ' • ') : '') +
                        'Toque no card para ver o trajeto no mapa acima' +
                    '</div>' +
                    '<div class="fav-route">' +
                        '🟢 <b>De (Embarque):</b> ' + item.pickup + '<br/>' +
                        '🏁 <b>Para (Destino):</b> ' + item.dropoff +
                    '</div>' +
                    '<div class="fav-actions">' +
                        '<button class="btn btn-nav-pickup" onclick="event.stopPropagation(); navPickup(' + idx + ')">📍 Ir p/ Embarque</button>' +
                        '<button class="btn btn-nav-drop" onclick="event.stopPropagation(); navDropoff(' + idx + ')">🏁 Ir p/ Destino</button>' +
                        '<button class="btn btn-del" onclick="event.stopPropagation(); deleteItem(' + item.id + ')">🗑</button>' +
                    '</div>';
                root.appendChild(card);
            });

            if (selectedIdx >= 0 && selectedIdx < favItems.length) {
                showRouteOnMap(selectedIdx);
            } else {
                showRouteOnMap(0);
            }
        }

        function showRouteOnMap(idx) {
            selectedIdx = idx;
            var cards = document.querySelectorAll('.fav-card');
            cards.forEach(function(c, i) {
                c.className = 'fav-card' + (i === idx ? ' selected' : '');
            });

            var item = favItems[idx];
            if (!item) return;

            layerGroup.clearLayers();
            var bounds = [];

            if (item.pLat && item.pLng && item.pLat !== 0) {
                var pIcon = L.divIcon({
                    className: '',
                    html: '<div class="pin-pickup">🟢 Emb ' + item.rideTime + '</div>',
                    iconSize: [95, 24],
                    iconAnchor: [47, 12]
                });
                var pMarker = L.marker([item.pLat, item.pLng], { icon: pIcon }).addTo(layerGroup);
                pMarker.bindPopup('<b>🟢 Embarque (' + item.rideTime + ')</b><br/>' + item.pickup).openPopup();
                bounds.push([item.pLat, item.pLng]);
            }

            if (item.dLat && item.dLng && item.dLat !== 0) {
                var dIcon = L.divIcon({
                    className: '',
                    html: '<div class="pin-dropoff">🏁 Destino</div>',
                    iconSize: [85, 24],
                    iconAnchor: [42, 12]
                });
                var dMarker = L.marker([item.dLat, item.dLng], { icon: dIcon }).addTo(layerGroup);
                dMarker.bindPopup('<b>🏁 Destino</b><br/>' + item.dropoff);
                bounds.push([item.dLat, item.dLng]);
            }

            if (bounds.length === 2) {
                L.polyline(bounds, {
                    color: '#ff4081',
                    weight: 4,
                    dashArray: '8, 6'
                }).addTo(layerGroup);
                map.fitBounds(bounds, { padding: [45, 45], maxZoom: 16 });
            } else if (bounds.length === 1) {
                map.setView(bounds[0], 16);
            }
        }

        function navPickup(idx) {
            var it = favItems[idx];
            if (it && window.AndroidFavBridge) {
                window.AndroidFavBridge.onNavigateTo(it.pLat || 0, it.pLng || 0, it.pickup || '');
            }
        }

        function navDropoff(idx) {
            var it = favItems[idx];
            if (it && window.AndroidFavBridge) {
                window.AndroidFavBridge.onNavigateTo(it.dLat || 0, it.dLng || 0, it.dropoff || '');
            }
        }

        function deleteItem(id) {
            if (window.AndroidFavBridge) {
                window.AndroidFavBridge.onDeleteFavorite(String(id));
            }
        }
    </script>
</body>
</html>
